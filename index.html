    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      .goog-te-banner-frame.skiptranslate, .goog-te-banner-frame, iframe.goog-te-banner-frame {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
      .goog-tooltip, #goog-gt-tt {
        display: none !important;
        visibility: hidden !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
    </style>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        try {
          if (window.google && window.google.translate) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'fr',
              autoDisplay: false,
              layout: window.google.translate.TranslateElement.InlineLayout?.SIMPLE
            }, 'google_translate_element');
          }
        } catch(e) {}
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
  </head>
  <body>
    <script>
      // Détection de fin de redirection OAuth dans un popup
      if (window.opener && (window.location.hash.includes('access_token') || window.location.search.includes('code='))) {
        try {
          window.opener.postMessage({ type: 'SUPABASE_OAUTH_SUCCESS' }, '*');
          setTimeout(function() { window.close(); }, 300);
        } catch (e) {}
      }
    </script>
    <div id="google_translate_element" style="display:none"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
